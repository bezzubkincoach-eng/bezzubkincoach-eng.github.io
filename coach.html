<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ссылка для клиента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f1;--card:#fff;--ink:#18181b;--mute:#6f6f76;--line:#e6e4df;--acc:#d6402e;--shadow:0 1px 2px rgba(20,20,20,.04),0 2px 8px rgba(20,20,20,.04);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c1f;--ink:#f1f1f2;--mute:#9a9aa1;--line:#2a2a2e;--acc:#ff5a44;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.brand{font-weight:600;font-size:15px}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:28px 0 18px}
input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:inherit;padding:0 16px;font:inherit;outline:none}
input:focus{border-color:var(--ink)}
.err{color:var(--acc);font-size:15px;margin-top:10px;display:none}
.out{display:none;margin-top:14px;background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.link{word-break:break-all;font-size:14px;color:var(--mute);margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,a.btn{height:48px;border-radius:12px;border:0;font:inherit;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
button{background:var(--ink);color:var(--bg)}
a.btn{background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<div class="w">
  <div class="brand">Артём Беззубкин</div>
  <h1>Ссылка для клиента</h1>
  <input id="src" placeholder="Ссылка на Google-таблицу" autocomplete="off">
  <div class="err" id="err">Неверная ссылка</div>
  <div class="out" id="out">
    <div class="link" id="link"></div>
    <div class="row"><button id="copy">Скопировать</button><a class="btn" id="open" target="_blank" rel="noopener">Открыть</a></div>
  </div>
</div>
<script>
const src=document.getElementById('src'),out=document.getElementById('out'),err=document.getElementById('err');
src.addEventListener('input',()=>{
  const v=src.value.trim();
  const m=v.match(/\/d\/([a-zA-Z0-9_-]{20,})/)||v.match(/^([a-zA-Z0-9_-]{30,})$/);
  err.style.display=v&&!m?'block':'none';
  if(!m){out.style.display='none';return}
  const url=new URL('./',location.href).href+'?id='+m[1];
  document.getElementById('link').textContent=url;
  document.getElementById('open').href=url;
  out.style.display='block';
});
document.getElementById('copy').onclick=async e=>{
  const t=document.getElementById('link').textContent;
  try{await navigator.clipboard.writeText(t)}catch(_){const r=document.createRange();r.selectNode(document.getElementById('link'));getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand('copy')}
  e.target.textContent='Скопировано';setTimeout(()=>e.target.textContent='Скопировать',1500);
};
</script>
</body>
</html>
