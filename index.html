<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<title>Артём Беззубкин</title>
<meta name="description" content="Программа тренировок">
<meta property="og:type" content="website">
<meta property="og:title" content="Артём Беззубкин">
<meta property="og:description" content="Программа тренировок">
<meta property="og:image" content="https://bezzubkincoach-eng.github.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f1;--card:#fff;--ink:#18181b;--mute:#6f6f76;--faint:#a3a3a9;--line:#e6e4df;
  --acc:#d6402e;--acc-ink:#fff;--acc-soft:#fbe9e6;--ok:#2f8f5b;
  --r:16px;--shadow:0 1px 2px rgba(20,20,20,.04),0 2px 8px rgba(20,20,20,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121214;--card:#1c1c1f;--ink:#f1f1f2;--mute:#9a9aa1;--faint:#5f5f66;--line:#2a2a2e;
    --acc:#ff5a44;--acc-ink:#fff;--acc-soft:#3a1d19;--ok:#4cc488;--shadow:none;color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em}
.who{font-size:14px;color:var(--mute)}

/* hero */
.hero{padding:14px 0 18px}
.meta{color:var(--mute);font-size:15px}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:2px 0 0;font-weight:700}
.tag{display:inline-block;vertical-align:middle;margin-left:8px;font-size:13px;font-weight:500;color:var(--acc);
  background:var(--acc-soft);border-radius:999px;padding:3px 10px;letter-spacing:0}
.prog{display:flex;align-items:center;gap:12px;margin-top:16px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.count{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}

/* exercise cards */
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.name{font-weight:600;font-size:17px;line-height:1.3}
.plan{margin-top:3px;font-size:15px;font-variant-numeric:tabular-nums}
.sub{margin-top:2px;font-size:14px;color:var(--mute)}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.set{min-width:64px;height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);
  font-size:15px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s}
.set:active{transform:scale(.97)}
.set.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.set.on::before{content:'✓ ';font-weight:600}

.btn{display:block;width:100%;height:52px;border-radius:14px;font-weight:600;font-size:16px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--card);box-shadow:var(--shadow)}
.btn:disabled{opacity:.4}
.foot{margin-top:18px;display:grid;gap:10px}
.done-note{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:500;margin-top:10px}

/* program */
.seg{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;box-shadow:var(--shadow);margin:6px 0 18px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:15px;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
.week{margin:0 0 18px}
.week h2{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 8px;padding-left:4px}
.rows{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:600}
.row .t small{display:block;color:var(--mute);font-size:14px}
.row .s{font-size:14px;color:var(--mute);white-space:nowrap}
.row .s.ok{color:var(--ok)}
.row .s.now{color:var(--acc);font-weight:500}
.chev{color:var(--faint)}

/* gate */
.gate{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.gate h1{font-size:34px}
.field{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:16px;outline:none}
.field:focus{border-color:var(--ink)}
.err{color:var(--acc);font-size:15px;min-height:22px}
.skel{height:84px;border-radius:var(--r);background:var(--card);opacity:.6;animation:pulse 1.2s infinite ease-in-out}
@keyframes pulse{50%{opacity:.3}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--faint);padding:6px 0}
.nav button.on{color:var(--ink)}
.nav svg{width:24px;height:24px}

/* rest timer */
.rest{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;z-index:6;
  background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden}
.rest .tm{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rest .of{font-size:14px;opacity:.6;flex:1}
.rest button{height:36px;padding:0 12px;border-radius:10px;background:color-mix(in srgb,var(--bg) 16%,transparent);font-size:14px;font-weight:500}
.rest .line{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);transition:width 1s linear}
.rest.over .tm{color:var(--acc)}
body.resting .wrap{padding-bottom:calc(170px + env(safe-area-inset-bottom))}

/* edit sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 16px;font-size:18px;font-weight:600}
.step{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.step span{color:var(--mute)}
.step .c{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:12px;background:var(--bg);font-size:22px;line-height:1}
.step input{width:84px;height:44px;text-align:center;border:0;border-radius:12px;background:var(--bg);font-size:18px;font-weight:600;outline:none;font-variant-numeric:tabular-nums}
.sheet .foot{grid-template-columns:1fr 1fr;margin-top:16px}
.cnote{display:block;margin-top:10px;font-size:14px;color:var(--mute);text-align:left}
.cnote.empty{color:var(--faint)}
.box{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-top:18px}
.box .k{font-size:14px;color:var(--mute);margin-bottom:10px}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{height:40px;border-radius:10px;border:1.5px solid var(--line);font-size:15px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.rpe button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
textarea.field{height:auto;min-height:84px;padding:12px 14px;resize:vertical;line-height:1.4;margin-top:12px;display:block}
.cfoot{display:flex;align-items:baseline;gap:12px}
.cfoot .cnote{flex:1}
.warm{font-size:14px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.calc{display:grid;gap:10px}
.calc h2{font-size:17px;font-weight:600;margin:0 0 6px}
.calc .step{padding:6px 0}
.res{margin-top:10px;border-top:1px solid var(--line)}
.res .r{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.res .r:last-child{border-bottom:0}
.res .r span{color:var(--mute);font-size:14px}
.res .r b{margin-left:auto;font-weight:600}
.res .r em{font-style:normal;color:var(--mute);font-size:14px;min-width:42px;text-align:right}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:10px}
.big small{font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0;display:block}
.undo{margin-left:auto;font-size:14px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div id="app"></div>

<script src="xlsx.full.min.js"></script>
<script>
const KEY='bz_app_v2';
const SYNC='https://script.google.com/macros/s/AKfycby6yPBCpwfNIpM34tRwMVEdwmlI7iTVmdzg-w2GnH1vM2RlgpUwZvUmYkaoYlgp3o9r/exec';
let S={id:'',plan:null,log:{},cur:'',tab:'today',rest:null};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const m=String(v??'').replace(',','.').match(/-?\d+(\.\d+)?/);return m?+m[0]:NaN};
const fmt=n=>Number.isFinite(n)?String(Math.round(n*100)/100).replace('.',','):'';
const cell=v=>(v==null?'':String(v)).trim();

// ── загрузка таблицы ───────────────────────────────
function idFrom(v){
  v=(v||'').trim();
  const m=v.match(/\/d\/([a-zA-Z0-9_-]{20,})/)||v.match(/[?&#]id=([a-zA-Z0-9_-]{20,})/);
  return m?m[1]:(/^[a-zA-Z0-9_-]{25,}$/.test(v)?v:'');
}
function trName(t){
  t=cell(t).toUpperCase().replace(/^ТРЕНИРОВКА\s*/,'');
  if(!t) return null;
  let [l,...rest]=t.split('·').map(x=>x.trim());
  l=({A:'А',B:'Б',C:'В',D:'Г'})[l]||l;
  const kind=rest.join(' ').toLowerCase().replace(/\s*неделя\s*/,'').trim();
  return {letter:l,kind};
}
function parseMeso(grid){
  const weeks={};let wk=0,L=null,R=null,on=false;
  for(const r of grid){
    const b=cell(r[1]),up=b.toUpperCase(),m=up.match(/^НЕДЕЛЯ\s*(\d+)/);
    if(m){wk=+m[1];on=false;weeks[wk]={n:wk,label:/РАЗГРУЗ|DELOAD/.test(up)?'Разгрузка':'',w:{}};continue}
    if(up.startsWith('ТРЕНИРОВКА')){L=trName(b);R=trName(r[10]);on=false;continue}
    if(up==='УПРАЖНЕНИЕ'){on=true;continue}
    if(up==='ИТОГО'){on=false;continue}
    if(!on||!wk) continue;
    [[L,1],[R,10]].forEach(([t,c])=>{
      const name=cell(r[c]);
      if(!t||!name) return;
      const k=t.letter+'|'+t.kind;
      const w=weeks[wk].w[k]??={letter:t.letter,kind:t.kind,ex:[]};
      let wt=cell(r[c+1]);if(/^0+([.,]0*)?$/.test(wt)) wt='';
      w.ex.push({name,wt,st:cell(r[c+2]),rp:cell(r[c+3]),rest:cell(r[c+4]),note:cell(r[c+5])});
    });
  }
  const kindOrder=k=>k.startsWith('нечёт')||k.startsWith('нечет')?0:k.startsWith('чёт')||k.startsWith('чет')?1:2;
  return Object.values(weeks).map(W=>{
    const list=Object.values(W.w).sort((a,b)=>kindOrder(a.kind)-kindOrder(b.kind)||a.letter.localeCompare(b.letter,'ru'));
    const sameLetter=l=>list.filter(x=>x.letter===l).length>1;
    list.forEach(x=>x.sub=sameLetter(x.letter)?x.kind:'');
    return {n:W.n,label:W.label,workouts:list};
  }).filter(W=>W.workouts.length);
}
async function fetchPlan(id){
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/export?format=xlsx`,{cache:'no-store'});
  if(!r.ok) throw 0;
  const buf=await r.arrayBuffer(),b=new Uint8Array(buf.slice(0,2));
  if(b[0]!==0x50||b[1]!==0x4B) throw 0;
  const wb=XLSX.read(buf,{type:'array'});
  const grid=n=>{const ws=wb.Sheets[n],g=XLSX.utils.decode_range(ws['!ref']||'A1');g.s.r=0;g.s.c=0;
    return XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',blankrows:true,range:g})};
  const blocks=[];
  wb.SheetNames.forEach(n=>{
    const m=n.toUpperCase().match(/^МЕЗОЦИКЛ\s*(\d+)/);
    if(!m) return;
    const weeks=parseMeso(grid(n));
    if(weeks.length) blocks.push({n:+m[1],weeks});
  });
  blocks.sort((a,b)=>a.n-b.n);
  let client='';
  const k=wb.SheetNames.find(n=>n.toUpperCase()==='КЛИЕНТ');
  if(k) for(const r of grid(k)){const i=r.findIndex(v=>cell(v).toLowerCase()==='имя');
    if(i>=0){const v=r.slice(i+1).map(cell).find(Boolean);if(v){client=v;break}}}
  return {blocks,client};
}

// ── модель ─────────────────────────────────────────
function flat(){
  const out=[];
  (S.plan?.blocks||[]).forEach(B=>B.weeks.forEach(W=>W.workouts.forEach(w=>
    out.push({id:`${B.n}.${W.n}.${w.letter}.${w.kind}`,B,W,w}))));
  return out;
}
const isDone=id=>!!S.log[id]?.done;
function current(){
  const all=flat();
  return all.find(x=>x.id===S.cur)||all.find(x=>!isDone(x.id))||all[all.length-1];
}
const title=w=>'Тренировка '+w.letter;
const sub=w=>w.sub||'';
function setsOf(e){const n=Math.round(num(e.st));return n>0&&n<20?n:1}
function planText(e){
  const reps=e.rp||'';
  const sr=e.st&&reps?`${e.st} × ${reps}`:(reps?`${reps} повт.`:(e.st?`${e.st} подх.`:''));
  const w=e.wt?(Number.isFinite(num(e.wt))&&/^[\d.,\s]+$/.test(e.wt)?`${fmt(num(e.wt))} кг`:e.wt):'';
  return [sr,w].filter(Boolean).join(' · ');
}
const mmss=s=>`${Math.floor(s/60)}:${String(Math.round(s)%60).padStart(2,'0')}`;
function pillText(w,r){return (w!==''&&w!=null?`${fmt(+w)} × `:'× ')+(r??'')}
function restSec(t){
  t=(t||'').toLowerCase();if(!t) return 0;
  let m=t.match(/(\d+)\s*[:.]\s*(\d{2})/);if(m) return +m[1]*60+ +m[2];
  m=t.match(/(\d+(?:[.,]\d+)?)\s*м/);if(m) return Math.round(num(m[1])*60);
  m=t.match(/(\d+)\s*с/);if(m) return +m[1];
  const n=num(t);return Number.isFinite(n)?(n<=10?Math.round(n*60):Math.round(n)):0;
}

// ── отрисовка ──────────────────────────────────────
const ICON={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
  calc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg>',
  plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>'
};
function shell(inner){
  const name=S.plan?.client||'';
  return `<div class="wrap"><div class="top"><span class="brand">Артём Беззубкин</span>${name?`<span class="who">${h(name)}</span>`:''}</div>${inner}</div>
  <nav class="nav"><div class="in">
    <button data-tab="today" class="${S.tab==='today'?'on':''}">${ICON.today}Сегодня</button>
    <button data-tab="plan" class="${S.tab==='plan'?'on':''}">${ICON.plan}Программа</button>
    <button data-tab="calc" class="${S.tab==='calc'?'on':''}">${ICON.calc}Калькулятор</button>
  </div></nav><div id="restbox"></div>`;
}
function render(){
  const app=$('#app');
  if(!S.id){app.innerHTML=gate();bindGate();return}
  if(!S.plan){app.innerHTML=shell('<div class="hero"><div class="skel" style="height:60px;width:60%"></div></div><div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>');return}
  app.innerHTML=shell(S.tab==='plan'?program():S.tab==='calc'?calc():today());
  bind();bindCalc();restTick();
}
function gate(err){
  return `<div class="wrap"><div class="gate">
    <div class="brand">Артём Беззубкин</div>
    <h1>Программа тренировок</h1>
    <input class="field" id="link" placeholder="Ссылка на программу" autocomplete="off" inputmode="url">
    <button class="btn pri" id="open">Открыть</button>
    <div class="err" id="gerr">${err?h(err):''}</div>
  </div></div>`;
}
function today(){
  const c=current();
  if(!c) return `<div class="hero"><h1>Программа пока пустая</h1></div>`;
  const {B,W,w,id}=c,log=S.log[id]||{},sets=log.sets||{};
  let total=0,done=0;
  w.ex.forEach((e,i)=>{const n=setsOf(e);total+=n;for(let k=0;k<n;k++) if(sets[i]?.[k]) done++});
  const multi=(S.plan.blocks.length>1);
  const cards=w.ex.map((e,i)=>{
    const n=setsOf(e),pw=Number.isFinite(num(e.wt))&&/^[\d.,\s]+$/.test(e.wt)?num(e.wt):'',pr=num(e.rp);
    const pills=Array.from({length:n},(_,k)=>{
      const s=sets[i]?.[k];
      return `<button class="set ${s?'on':''}" data-ex="${i}" data-set="${k}">${s?pillText(s.w,s.r):pillText(pw,Number.isFinite(pr)?pr:'')}</button>`;
    }).join('');
    const subl=[e.rest&&('отдых '+e.rest),e.note].filter(Boolean).map(h).join(' · ');
    return `<li class="card"><div class="name">${h(e.name)}</div>
      <div class="plan">${h(planText(e))}</div>${subl?`<div class="sub">${subl}</div>`:''}
      <div class="sets">${pills}</div>
      <div class="cfoot"><button class="cnote ${log.notes?.[i]?'':'empty'}" data-note="${i}">${log.notes?.[i]?'«'+h(log.notes[i])+'»':'+ Комментарий'}</button>${pw>0?`<button class="warm" data-warm="${pw}">Разминка</button>`:''}</div></li>`;
  }).join('');
  const all=flat(),idx=all.findIndex(x=>x.id===id),next=all.slice(idx+1).find(x=>!isDone(x.id));
  const box=`<div class="box"><div class="k">Тяжесть тренировки</div>
      <div class="rpe">${Array.from({length:10},(_,k)=>`<button data-rpe="${k+1}" class="${log.rpe===k+1?'on':''}">${k+1}</button>`).join('')}</div>
      <textarea class="field" id="wnote" rows="3" placeholder="Комментарий к тренировке">${h(log.wnote||'')}</textarea></div>`;
  const foot=log.done
    ?`<div class="done-note">✓ Выполнено ${h(log.done)}<button class="undo" id="undo">Отменить</button></div>${next?`<button class="btn pri" id="next">Следующая: ${h(title(next.w))}</button>`:''}`
    :`<button class="btn pri" id="finish" ${done?'':'disabled'}>Завершить тренировку</button>`;
  return `<section class="hero">
      <div class="meta">${multi?`Блок ${B.n} · `:''}Неделя ${W.n}${sub(w)?` · ${h(sub(w))}`:''}</div>
      <h1>${h(title(w))}${W.label?`<span class="tag">${h(W.label)}</span>`:''}</h1>
      <div class="prog"><div class="bar"><i style="width:${total?done/total*100:0}%"></i></div><div class="count">${done} из ${total}</div></div>
    </section>
    <ol class="list">${cards}</ol>
    ${box}
    <div class="foot">${foot}</div>`;
}
function program(){
  const blocks=S.plan.blocks;
  if(!blocks.length) return `<div class="hero"><h1>Программа пока пустая</h1></div>`;
  const cur=current();
  const bsel=S.block&&blocks.find(b=>b.n===S.block)?S.block:(cur?.B.n||blocks[0].n);
  const B=blocks.find(b=>b.n===bsel);
  const seg=blocks.length>1?`<div class="seg">${blocks.map(b=>`<button data-block="${b.n}" class="${b.n===bsel?'on':''}">Блок ${b.n}</button>`).join('')}</div>`:'';
  const weeks=B.weeks.map(W=>`<section class="week"><h2>Неделя ${W.n}${W.label?` · ${h(W.label.toLowerCase())}`:''}</h2><div class="rows">${
    W.workouts.map(w=>{
      const id=`${B.n}.${W.n}.${w.letter}.${w.kind}`,d=S.log[id]?.done,now=cur&&cur.id===id&&!d;
      return `<button class="row" data-go="${h(id)}"><span class="t"><b>${h(title(w))}</b>${sub(w)?` <span class="meta">· ${h(sub(w))}</span>`:''}
        <small>${w.ex.length} ${plural(w.ex.length,'упражнение','упражнения','упражнений')}</small></span>
        <span class="s ${d?'ok':now?'now':''}">${d?'✓ '+h(d):now?'сейчас':''}</span><span class="chev">›</span></button>`;
    }).join('')}</div></section>`).join('');
  return `<section class="hero"><h1>Программа</h1></section>${seg}${weeks}`;
}
// ── калькулятор (формулы листа КАЛЬКУЛЯТОР) ───────
const r25=v=>Math.round(v/2.5+1e-9)*2.5;
const WARM=[[.35,'1–8'],[.5,'1–5'],[.65,'1–3'],[.75,'1–3'],[.85,'1–2'],[.95,'1']];
const PCT=[.6,.65,.7,.75,.8];
const RPE_T={10:[100,95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9],9.5:[97.8,93.9,90.7,87.8,85,82.4,79.9,77.4,75.1,72.3],
  9:[95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,71.4],8.5:[93.9,90.7,87.8,85,82.4,79.9,77.4,75.1,72.3,69.4],
  8:[92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,71.4,68],7.5:[90.7,87.8,85,82.4,79.9,77.4,75.1,72.3,69.4,66.7],
  7:[89.2,86.3,83.7,81.1,78.6,76.2,73.9,71.4,68,65.3],6.5:[87.8,85,82.4,79.9,77.4,75.1,72.3,69.4,66.7,64],
  6:[86.3,83.7,81.1,78.6,76.2,73.9,71.4,68,65.3,62.6],5.5:[85,82.4,79.9,77.4,75.1,72.3,69.4,66.7,64,61.3],
  5:[83.7,81.1,78.6,76.2,73.9,71.4,68,65.3,62.6,59.9]};
const C=()=>S.calc??={ww:'',wn:6,w:'',r:'',rpe:8,rr:5};
const kg=v=>fmt(v)+' кг';
function oneRM(){
  const c=C(),w=num(c.w),r=num(c.r);
  if(!(w>0&&r>0&&r<37)) return null;
  const e=w*(1+r/30),b=w*(36/(37-r));
  return {e,b,avg:(e+b)/2};
}
function stepRow(label,k,d,mode){
  const v=C()[k];
  return `<div class="step"><span>${label}</span><div class="c"><button data-cd="${k}:${-d}">−</button><input data-ck="${k}" inputmode="${mode||'decimal'}" value="${h(v===''?'':fmt(+v))}"><button data-cd="${k}:${d}">+</button></div></div>`;
}
function calc(){
  return `<section class="hero"><h1>Калькулятор</h1></section><div class="calc">
    <div class="card"><h2>Разминка</h2>${stepRow('Рабочий вес, кг','ww',2.5)}${stepRow('Подходов','wn',1,'numeric')}<div class="res" id="c-warm"></div></div>
    <div class="card"><h2>Повторный максимум</h2>${stepRow('Вес, кг','w',2.5)}${stepRow('Повторы','r',1,'numeric')}<div id="c-rm"></div></div>
    <div class="card"><h2>RPE</h2>${stepRow('RPE','rpe',.5)}${stepRow('Повторы','rr',1,'numeric')}<div id="c-rpe"></div></div>
  </div>`;
}
function calcOut(){
  const c=C(),ww=num(c.ww),n=Math.max(1,Math.min(6,Math.round(num(c.wn))||6));
  const wb=$('#c-warm');if(!wb) return;
  wb.innerHTML=ww>0?WARM.slice(0,n).map(([p,rp],i)=>`<div class="r"><span>Подход ${i+1}</span><em>${Math.round(p*100)}%</em><b>${kg(r25(ww*p))}</b><em>${rp}</em></div>`).join(''):'';
  const m=oneRM();
  $('#c-rm').innerHTML=m?`<div class="big">${kg(Math.round(m.avg*10)/10)}<small>Эпли ${fmt(Math.round(m.e*10)/10)} · Brzycki ${fmt(Math.round(m.b*10)/10)}</small></div>
    <div class="res">${PCT.map(p=>`<div class="r"><span>${Math.round(p*100)}%</span><b>${kg(r25(m.avg*p))}</b></div>`).join('')}</div>`:'';
  const rpe=Math.round(num(c.rpe)*2)/2,rr=Math.round(num(c.rr)),pct=RPE_T[rpe]?.[rr-1];
  $('#c-rpe').innerHTML=pct?`<div class="big">${fmt(pct)}%<small>от 1RM</small></div>${m?`<div class="res"><div class="r"><span>При 1RM ${kg(Math.round(m.avg*10)/10)}</span><b>${kg(r25(m.avg*pct/100))}</b></div></div>`:''}`:'';
}
function bindCalc(){
  if(S.tab!=='calc') return;
  const lim={wn:[1,6],rpe:[5,10],rr:[1,10],r:[1,36]};
  const clamp=(k,v)=>{const l=lim[k];return l?Math.max(l[0],Math.min(l[1],v)):Math.max(0,v)};
  document.querySelectorAll('[data-ck]').forEach(inp=>inp.oninput=()=>{const v=num(inp.value);C()[inp.dataset.ck]=Number.isFinite(v)?v:'';save();calcOut()});
  document.querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>{
    const [k,d]=b.dataset.cd.split(':'),cur=num(C()[k]),v=clamp(k,(Number.isFinite(cur)?cur:0)+ +d);
    C()[k]=v;$(`[data-ck="${k}"]`).value=fmt(v);save();calcOut();
  });
  calcOut();
}

const plural=(n,a,b,c)=>{n%=100;if(n>10&&n<20) return c;n%=10;return n===1?a:n>1&&n<5?b:c};

// ── отправка результатов в таблицу ─────────────────
function payload(c){
  return {id:S.id,block:c.B.n,week:c.W.n,letter:c.w.letter,kind:c.w.kind,
    title:[S.plan.blocks.length>1?`Блок ${c.B.n}`:'',`Неделя ${c.W.n}`,`Тренировка ${c.w.letter}`+(c.w.sub?` ${c.w.sub}`:'')].filter(Boolean).join(' · ')};
}
function restAvg(row){
  const ts=(row||[]).filter(x=>x&&x.t).map(x=>x.t).sort((a,b)=>a-b),g=[];
  for(let j=1;j<ts.length;j++){const d=(ts[j]-ts[j-1])/1000;if(d>=15&&d<=900) g.push(d)}
  return g.length?g.reduce((a,b)=>a+b)/g.length:0;
}
function queue(c){
  const L=S.log[c.id];
  if(!SYNC||!L?.done) return;
  const sets=L.sets||{},notes=L.notes||{};
  const ts=Object.values(sets).flat().filter(x=>x&&x.t).map(x=>x.t);
  let dur=L.fin&&ts.length?Math.round((L.fin-Math.min(...ts))/60000):0;
  if(dur<1||dur>240) dur=0;
  (S.out??={})[c.id]={...payload(c),date:L.done,rpe:L.rpe||0,comment:L.wnote||'',dur,
    items:c.w.ex.map((e,i)=>{
      const t=(sets[i]||[]).filter(Boolean).map(x=>x.w!==''&&x.w!=null?`${fmt(+x.w)}×${x.r}`:`×${x.r}`).join(', ');
      const r=restAvg(sets[i]),n=notes[i];
      return {name:e.name,text:(t||n)?[t,L.done,r?`отдых ~${mmss(r)}`:'',n?`«${n}»`:''].filter(Boolean).join(' · '):''};
    })};
  save();flush();
}
function unqueue(c){
  if(!SYNC) return;
  (S.out??={})[c.id]={...payload(c),undo:true,items:c.w.ex.map(e=>({name:e.name,text:''}))};
  save();flush();
}
let flushing=false;
async function flush(){
  if(!SYNC||flushing||!S.out) return;
  flushing=true;
  for(const [k,p] of Object.entries(S.out)){
    if(p.id!==S.id){delete S.out[k];continue}
    try{const r=await fetch(SYNC,{method:'POST',body:JSON.stringify(p)});const j=await r.json();if(j.ok){delete S.out[k];save()}}catch(e){break}
  }
  flushing=false;
}

// ── действия ───────────────────────────────────────
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();render();scrollTo(0,0)});
  document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{S.block=+b.dataset.block;render()});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.go;S.tab='today';save();render();scrollTo(0,0)});
  document.querySelectorAll('.set').forEach(b=>b.onclick=()=>tapSet(+b.dataset.ex,+b.dataset.set));
  const f=$('#finish');if(f) f.onclick=()=>{const c=current(),L=S.log[c.id]??={};L.done=new Date().toLocaleDateString('ru',{day:'numeric',month:'short'}).replace('.','');L.fin=Date.now();S.rest=null;save();render();queue(c)};
  const u=$('#undo');if(u) u.onclick=()=>{const c=current(),L=S.log[c.id];delete L.done;delete L.fin;save();render();unqueue(c)};
  document.querySelectorAll('[data-rpe]').forEach(b=>b.onclick=()=>{const c=current(),L=S.log[c.id]??={},v=+b.dataset.rpe;L.rpe=L.rpe===v?0:v;S.cur=c.id;save();render();queue(c)});
  const wn=$('#wnote');if(wn){wn.oninput=()=>{const c=current();(S.log[c.id]??={}).wnote=wn.value;S.cur=c.id;save()};wn.onchange=()=>queue(current())}
  document.querySelectorAll('[data-warm]').forEach(b=>b.onclick=()=>{C().ww=+b.dataset.warm;S.tab='calc';save();render();scrollTo(0,0)});
  document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>noteEdit(+b.dataset.note));
  const n=$('#next');if(n) n.onclick=()=>{const all=flat(),i=all.findIndex(x=>x.id===current().id);const nx=all.slice(i+1).find(x=>!isDone(x.id));if(nx){S.cur=nx.id;save();render();scrollTo(0,0)}};
}
function tapSet(i,k){
  const c=current(),e=c.w.ex[i],log=S.log[c.id]??={},sets=log.sets??={},row=sets[i]??=[];
  if(row[k]){edit(i,k);return}
  const pw=Number.isFinite(num(e.wt))&&/^[\d.,\s]+$/.test(e.wt)?num(e.wt):'';
  const prev=row.slice(0,k).reverse().find(Boolean);
  row[k]=prev?{w:prev.w,r:prev.r,t:Date.now()}:{w:pw,r:Number.isFinite(num(e.rp))?num(e.rp):'',t:Date.now()};
  S.cur=c.id;
  const t=restSec(e.rest);S.rest={start:Date.now(),target:t,buzzed:false};
  save();render();queue(c);
}
function edit(i,k){
  const c=current(),e=c.w.ex[i],s=S.log[c.id].sets[i][k];
  const box=document.createElement('div');box.className='scrim';
  box.innerHTML=`<div class="sheet"><h3>${h(e.name)} · подход ${k+1}</h3>
    <div class="step"><span>Вес, кг</span><div class="c"><button data-d="w:-2.5">−</button><input id="ew" inputmode="decimal" value="${h(s.w===''?'':fmt(+s.w))}"><button data-d="w:2.5">+</button></div></div>
    <div class="step"><span>Повторы</span><div class="c"><button data-d="r:-1">−</button><input id="er" inputmode="numeric" value="${h(s.r)}"><button data-d="r:1">+</button></div></div>
    <div class="foot"><button class="btn sec" id="eclr">Не выполнен</button><button class="btn pri" id="eok">Готово</button></div></div>`;
  document.body.appendChild(box);
  const close=()=>box.remove();
  box.onclick=ev=>{if(ev.target===box) close()};
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    const [f,d]=b.dataset.d.split(':'),inp=box.querySelector(f==='w'?'#ew':'#er');
    const v=num(inp.value);inp.value=fmt(Math.max(0,(Number.isFinite(v)?v:0)+ +d));
  });
  box.querySelector('#eclr').onclick=()=>{S.log[c.id].sets[i][k]=null;save();close();render();queue(c)};
  box.querySelector('#eok').onclick=()=>{
    const w=num(box.querySelector('#ew').value),r=num(box.querySelector('#er').value);
    S.log[c.id].sets[i][k]={w:Number.isFinite(w)?w:'',r:Number.isFinite(r)?r:'',t:s.t};save();close();render();queue(c);
  };
}

function noteEdit(i){
  const c=current(),e=c.w.ex[i],L=S.log[c.id]??={};
  const box=document.createElement('div');box.className='scrim';
  box.innerHTML=`<div class="sheet"><h3>${h(e.name)}</h3>
    <textarea class="field" id="nt" rows="3" placeholder="Комментарий">${h(L.notes?.[i]||'')}</textarea>
    <div class="foot"><button class="btn sec" id="nx">Отмена</button><button class="btn pri" id="nok">Сохранить</button></div></div>`;
  document.body.appendChild(box);
  const close=()=>box.remove();
  box.onclick=ev=>{if(ev.target===box) close()};
  box.querySelector('#nx').onclick=close;
  box.querySelector('#nok').onclick=()=>{
    const v=box.querySelector('#nt').value.trim();
    (L.notes??={})[i]=v;if(!v) delete L.notes[i];
    S.cur=c.id;save();close();render();queue(c);
  };
  setTimeout(()=>box.querySelector('#nt').focus(),50);
}

// ── таймер отдыха ──────────────────────────────────
let tick=null;
function restTick(){
  clearInterval(tick);
  const box=$('#restbox');if(!box) return;
  const draw=()=>{
    document.body.classList.toggle('resting',!!S.rest);
    if(!S.rest){box.innerHTML='';clearInterval(tick);return}
    const el=Math.floor((Date.now()-S.rest.start)/1000),t=S.rest.target;
    if(el>3600){S.rest=null;save();box.innerHTML='';document.body.classList.remove('resting');return}
    const mm=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    const over=t&&el>=t;
    if(over&&!S.rest.buzzed){S.rest.buzzed=true;save();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
    box.innerHTML=`<div class="rest ${over?'over':''}"><span class="tm">${mm(el)}</span><span class="of">${t?'отдых '+mm(t):'отдых'}</span>
      ${t?'<button id="r30">+30 с</button>':''}<button id="rx">✕</button>${t?`<i class="line" style="width:${Math.min(100,el/t*100)}%"></i>`:''}</div>`;
    const a=$('#r30');if(a) a.onclick=()=>{S.rest.target+=30;S.rest.buzzed=false;save();draw()};
    $('#rx').onclick=()=>{S.rest=null;save();draw()};
  };
  draw();tick=setInterval(draw,1000);
}

// ── запуск ─────────────────────────────────────────
function bindGate(){
  const go=async()=>{
    const id=idFrom($('#link').value);
    if(!id){$('#gerr').textContent='Неверная ссылка';return}
    $('#open').disabled=true;
    try{await load(id,true)}catch(e){$('#gerr').textContent='Не удалось открыть программу';$('#open').disabled=false}
  };
  $('#open').onclick=go;$('#link').onkeydown=e=>{if(e.key==='Enter') go()};
}
async function load(id,strict){
  const fresh=await fetchPlan(id).catch(e=>{if(strict||!S.plan) throw e;return null});
  if(!fresh) return;
  if(id!==S.id){S.log={};S.cur='';S.rest=null;S.block=0}
  S.id=id;S.plan=fresh;save();
  if(!$('.scrim')) render();
}
(function boot(){
  const q=idFrom(location.search+location.hash);
  if(q&&q!==S.id){S.id=q;S.plan=null;S.log={};S.cur='';S.rest=null}
  if(q) history.replaceState(null,'',location.pathname+'?id='+q);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  render();
  if(S.id){
    load(S.id).catch(()=>{if(!S.plan){S.id='';$('#app').innerHTML=gate('Не удалось открыть программу');bindGate()}});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.id){load(S.id).catch(()=>{});flush()}});
    addEventListener('online',flush);flush();
  }
})();
</script>
