<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<title>Артём Беззубкин</title>
<meta name="description" content="Программа тренировок">
<meta property="og:type" content="website">
<meta property="og:title" content="Артём Беззубкин">
<meta property="og:description" content="Программа тренировок">
<meta property="og:image" content="https://bezzubkincoach-eng.github.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f1;--card:#fff;--ink:#18181b;--mute:#6f6f76;--faint:#a3a3a9;--line:#e6e4df;
  --acc:#d6402e;--acc-ink:#fff;--acc-soft:#fbe9e6;--ok:#2f8f5b;--ok-soft:#e4f3ea;--warn:#b7791f;--warn-soft:#fbf0dc;
  --r:16px;--shadow:0 1px 2px rgba(20,20,20,.04),0 2px 8px rgba(20,20,20,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121214;--card:#1c1c1f;--ink:#f1f1f2;--mute:#9a9aa1;--faint:#5f5f66;--line:#2a2a2e;
    --acc:#ff5a44;--acc-ink:#fff;--acc-soft:#3a1d19;--ok:#4cc488;--ok-soft:#1b3326;--warn:#e0a84a;--warn-soft:#3a2d14;--shadow:none;color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
s{color:var(--faint)}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em}
.who{font-size:14px;color:var(--mute)}

/* hero */
.hero{padding:14px 0 18px}
.meta{color:var(--mute);font-size:15px}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:2px 0 0;font-weight:700}
.tag{display:inline-block;vertical-align:middle;margin-left:8px;font-size:13px;font-weight:500;color:var(--acc);
  background:var(--acc-soft);border-radius:999px;padding:3px 10px;letter-spacing:0}
.prog{display:flex;align-items:center;gap:12px;margin-top:16px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.count{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.back{font-size:15px;color:var(--mute);display:inline-block;margin-bottom:2px}

/* exercise cards */
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:17px;font-weight:600;margin:0 0 10px}
.name{font-weight:600;font-size:17px;line-height:1.3}
.plan{margin-top:3px;font-size:15px;font-variant-numeric:tabular-nums}
.plan .adj{color:var(--warn);font-weight:500}
.plan .approx{color:var(--mute)}
.sub{margin-top:2px;font-size:14px;color:var(--mute)}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.set{min-width:64px;height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);
  font-size:15px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s}
.set:active{transform:scale(.97)}
.set.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.set.on::before{content:'✓ ';font-weight:600}
.chips{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--mute)}
.chips .l{min-width:34px}
.chips button{flex:1;max-width:48px;height:34px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.metrics{margin-top:10px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;line-height:1.5}
.metrics b{color:var(--ink);font-weight:600;white-space:nowrap}
.metrics .up{color:var(--ok)}
.metrics .down{color:var(--acc)}

.btn{display:block;width:100%;height:52px;border-radius:14px;font-weight:600;font-size:16px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--card);box-shadow:var(--shadow)}
.btn:disabled{opacity:.4}
.foot{margin-top:18px;display:grid;gap:10px}
.done-note{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:500;margin-top:10px}

/* readiness */
.ready{margin-bottom:10px}
.ready .k{font-size:14px;color:var(--mute);margin-bottom:6px}
.rrow{display:flex;align-items:center;gap:6px;padding:5px 0}
.rrow span{flex:1;font-size:15px}
.rrow button{width:38px;height:36px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:500;color:var(--mute)}
.rrow button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.verdict{margin-top:10px;font-weight:600;display:flex;align-items:center;gap:10px}
.verdict small{font-weight:400;color:var(--mute);flex:1}
.ready.compact{display:flex;align-items:center;gap:10px;padding:12px 16px}
.ready.compact .v{flex:1;font-weight:500}
.ready.compact .v small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.lnk{font-size:14px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

/* program */
.seg{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;box-shadow:var(--shadow);margin:6px 0 18px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:15px;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.sm{margin:0}
.seg.sm button{height:34px;font-size:13px}
.week{margin:0 0 18px}
.week h2{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 8px;padding-left:4px}
.rows{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:600}
.row .t small{display:block;color:var(--mute);font-size:14px}
.row .s{font-size:14px;color:var(--mute);white-space:nowrap}
.row .s.ok{color:var(--ok)}
.row .s.now{color:var(--acc);font-weight:500}
.chev{color:var(--faint)}

/* tiles, tables, charts */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.tile .k{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.2}
.tile .v small{font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0}
.stack{display:grid;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--mute);text-align:right;padding:4px 4px 6px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal;padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl tr:last-child td{border-bottom:0}
.tbl .mute{color:var(--faint)}
.tbl .ok{color:var(--ok)} .tbl .low{color:var(--warn)} .tbl .high{color:var(--acc)}
.tbl b{font-weight:600}
.spark svg{width:100%;height:auto;display:block}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mute);white-space:nowrap}
.pill.z2{background:var(--ok-soft);color:var(--ok)}
.pill.hot{background:var(--acc-soft);color:var(--acc)}
.pill.warm{background:var(--warn-soft);color:var(--warn)}
.note{font-size:13px;color:var(--mute);margin-top:10px;line-height:1.45}
.crow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.crow:first-child{border-top:0}
.crow .d{font-size:13px;color:var(--mute);min-width:54px;font-variant-numeric:tabular-nums}
.crow .m{flex:1;min-width:0}
.crow .m b{font-weight:600;font-variant-numeric:tabular-nums}
.crow .m small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .pending{color:var(--faint);font-size:12px}
.empty{color:var(--mute);font-size:15px;padding:18px 0;text-align:center}
.help h2{font-size:15px;font-weight:600;margin:18px 0 6px}
.help p{margin:0 0 8px;font-size:15px;color:var(--ink)}

/* gate */
.gate{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.gate h1{font-size:34px}
.field{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:16px;outline:none}
.field:focus{border-color:var(--ink)}
.field.sm{height:46px;font-size:15px;padding:0 12px;background:var(--bg);border-color:transparent}
.field.sm:focus{border-color:var(--ink)}
.lbl{font-size:12px;color:var(--mute);margin:10px 0 4px;display:block}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frow .lbl{margin-top:0}
.err{color:var(--acc);font-size:15px;min-height:22px}
.skel{height:84px;border-radius:var(--r);background:var(--card);opacity:.6;animation:pulse 1.2s infinite ease-in-out}
@keyframes pulse{50%{opacity:.3}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--faint);padding:6px 0}
.nav button.on{color:var(--ink)}
.nav svg{width:24px;height:24px}

/* rest timer */
.rest{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;z-index:6;
  background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden}
.rest .tm{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rest .of{font-size:14px;opacity:.6;flex:1}
.rest button{height:36px;padding:0 12px;border-radius:10px;background:color-mix(in srgb,var(--bg) 16%,transparent);font-size:14px;font-weight:500}
.rest .line{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);transition:width 1s linear}
.rest.over .tm{color:var(--acc)}
body.resting .wrap{padding-bottom:calc(170px + env(safe-area-inset-bottom))}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:18px;font-weight:600}
.step{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.step span{color:var(--mute)}
.step .c{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:12px;background:var(--bg);font-size:22px;line-height:1}
.step input{width:84px;height:44px;text-align:center;border:0;border-radius:12px;background:var(--bg);font-size:18px;font-weight:600;outline:none;font-variant-numeric:tabular-nums}
.sheet .foot{grid-template-columns:1fr 1fr;margin-top:16px}
.sheet .live{font-size:14px;color:var(--mute);margin-top:10px;font-variant-numeric:tabular-nums}
.cnote{display:block;margin-top:10px;font-size:14px;color:var(--mute);text-align:left}
.cnote.empty{color:var(--faint)}
.box{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-top:18px}
.box .k{font-size:14px;color:var(--mute);margin-bottom:10px}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{height:40px;border-radius:10px;border:1.5px solid var(--line);font-size:15px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.rpe button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
textarea.field{height:auto;min-height:84px;padding:12px 14px;resize:vertical;line-height:1.4;margin-top:12px;display:block}
textarea.field.sm{min-height:64px;margin-top:0;padding:10px 12px}
.cfoot{display:flex;align-items:baseline;gap:12px}
.cfoot .cnote{flex:1}
.warm{font-size:14px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.calc{display:grid;gap:10px}
.calc .step{padding:6px 0}
.res{margin-top:10px;border-top:1px solid var(--line)}
.res .r{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.res .r:last-child{border-bottom:0}
.res .r span{color:var(--mute);font-size:14px}
.res .r b{margin-left:auto;font-weight:600}
.res .r em{font-style:normal;color:var(--mute);font-size:14px;min-width:42px;text-align:right}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:10px}
.big small{font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0;display:block}
.undo{margin-left:auto;font-size:14px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.menu .row .t b{font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script src="xlsx.full.min.js"></script>
<script>
const KEY='bz_app_v2';
const DEV=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const SYNC=DEV?(new URLSearchParams(location.search).get('sync')||'/__sync'):'https://script.google.com/macros/s/AKfycby6yPBCpwfNIpM34tRwMVEdwmlI7iTVmdzg-w2GnH1vM2RlgpUwZvUmYkaoYlgp3o9r/exec';
let S={id:'',plan:null,log:{},cur:'',tab:'today',rest:null};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
if(S.plan&&S.plan.v!==3) S.plan=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const m=String(v??'').replace(',','.').match(/-?\d+(\.\d+)?/);return m?+m[0]:NaN};
const fmt=n=>Number.isFinite(n)?String(Math.round(n*100)/100).replace('.',','):'';
const fmtI=n=>Number.isFinite(n)?Math.round(n).toLocaleString('ru-RU').replace(/\u00a0/g,' '):'';
const cell=v=>(v==null?'':String(v)).trim();
const upc=v=>cell(v).toUpperCase();
const zero=s=>/^0+([.,]0*)?$/.test(String(s).trim());
const isNum=s=>Number.isFinite(num(s))&&/^[\d.,\s]+$/.test(String(s).trim());
const norm=s=>String(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
const r25=v=>Math.round(v/2.5+1e-9)*2.5;
const plural=(n,a,b,c)=>{n%=100;if(n>10&&n<20) return c;n%=10;return n===1?a:n>1&&n<5?b:c};
const mmss=s=>`${Math.floor(s/60)}:${String(Math.round(s)%60).padStart(2,'0')}`;
const hms=s=>{s=Math.round(s);const hh=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return hh?`${hh}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${m}:${String(ss).padStart(2,'0')}`};
function parseTime(t){ // 'mm:ss' | 'h:mm:ss' | minutes
  t=cell(t);if(!t) return 0;
  const p=t.split(/[:.]/).map(x=>+x);
  if(p.length>=2&&p.every(Number.isFinite)) return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];
  const n=num(t);return Number.isFinite(n)?Math.round(n*60):0;
}
function parseDate(s){
  s=cell(s);let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  if(/^\d{5}(\.\d+)?$/.test(s)){const n=+s;if(n>20000&&n<80000) return new Date(Date.UTC(1899,11,30)+n*86400000+new Date().getTimezoneOffset()*60000)}
  m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/);if(m){let y=+m[3];if(y<100) y+=2000;return new Date(y,+m[2]-1,+m[1])}
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m) return new Date(+m[3],+m[1]-1,+m[2]);
  return null;
}
const iso=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';
const dShort=d=>d?d.toLocaleDateString('ru',{day:'numeric',month:'short'}).replace('.',''):'';
const dText=d=>d?`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()).slice(2)}`:'';
const today=()=>iso(new Date());

// ── загрузка таблицы ───────────────────────────────
function idFrom(v){
  v=(v||'').trim();
  const m=v.match(/\/d\/([a-zA-Z0-9_-]{20,})/)||v.match(/[?&#]id=([a-zA-Z0-9_-]{20,})/);
  return m?m[1]:(/^[a-zA-Z0-9_-]{25,}$/.test(v)?v:'');
}
function trName(t){
  t=cell(t).toUpperCase().replace(/^ТРЕНИРОВКА\s*/,'');
  if(!t) return null;
  let [l,...rest]=t.split('·').map(x=>x.trim());
  l=({A:'А',B:'Б',C:'В',D:'Г',E:'Д'})[l]||l;
  const kind=rest.join(' ').toLowerCase().replace(/\s*неделя\s*/,'').trim();
  return {letter:l,kind};
}
function hdrKey(v){
  const t=upc(v).replace(/[\s.]/g,'');
  if(!t) return '';
  if(t==='УПРАЖНЕНИЕ') return 'name';
  if(t.startsWith('ВЕС')) return 'wt';
  if(t.startsWith('СЕТ')||t.startsWith('ПОДХ')) return 'st';
  if(t.startsWith('ПОВТ')) return 'rp';
  if(t.startsWith('ОТДЫХ')) return 'rest';
  if(t.startsWith('ЗАМЕТ')||t.startsWith('КОММ')) return 'note';
  if(t==='RPE') return 'rpe';
  if(t.startsWith('ТОННАЖ')) return 'ton';
  if(t.startsWith('НАГР')) return 'au';
  if(t.startsWith('СЛЕД')) return 'next';
  if(t.startsWith('РЕЗУЛЬТ')) return 'res';
  return '';
}

function payload(c){
  return {id:S.id,op:'workout',block:c.B.n,week:c.W.n,letter:c.w.letter,kind:c.w.kind,
    title:[S.plan.blocks.length>1?`Блок ${c.B.n}`:'',`Неделя ${c.W.n}`,`Тренировка ${c.w.letter}`+(c.w.sub?` ${c.w.sub}`:'')].filter(Boolean).join(' · ')};
}
function restAvg(row){
  const ts=(row||[]).filter(x=>x&&x.t).map(x=>x.t).sort((a,b)=>a-b),g=[];
  for(let j=1;j<ts.length;j++){const d=(ts[j]-ts[j-1])/1000;if(d>=15&&d<=900) g.push(d)}
  return g.length?g.reduce((a,b)=>a+b)/g.length:0;
}
function queue(c){
  const L=S.log[c.id];
  if(!SYNC||!L?.done) return;
  const sets=L.sets||{},notes=L.notes||{},rpes=L.rpe_ex||{};
  const ts=Object.values(sets).flat().filter(x=>x&&x.t).map(x=>x.t);
  let dur=L.fin&&ts.length?Math.round((L.fin-Math.min(...ts))/60000):0;
  if(dur<1||dur>240) dur=0;
  let ton=0;
  const rd=readyVerdict(L.ready);
  (S.out??={})[c.id]={...payload(c),date:L.done,rpe:L.rpe||0,comment:L.wnote||'',dur,
    ready:rd?{s:L.ready.s,e:L.ready.e,m:L.ready.m}:null,
    items:c.w.ex.map((e,i)=>{
      const row=sets[i]||[],t=row.filter(Boolean).map(x=>x.w!==''&&x.w!=null?`${fmt(+x.w)}×${x.r}`:`×${x.r}`).join(', ');
      const r=restAvg(row),n=notes[i],nw=nextWeight(e,row,rpes[i]);ton+=exTon(row);
      return {name:e.name,rpe:rpes[i]||null,text:(t||n)?[t,L.done,r?`отдых ~${mmss(r)}`:'',n?`«${n}»`:'',nw?`→ ${fmt(nw.w)}`:''].filter(Boolean).join(' · '):''};
    })};
  S.out[c.id].ton=Math.round(ton);
  save();flush();
}
function unqueue(c){
  if(!SYNC) return;
  (S.out??={})[c.id]={...payload(c),undo:true,items:c.w.ex.map(e=>({name:e.name,text:'',rpe:null}))};
  save();flush();
}
function queueCardio(uid){
  const x=S.cardio[uid];if(!SYNC||!x) return;
  const sec=parseTime(x.time),km=num(x.dist);
  (S.out??={})['cardio:'+uid]={id:S.id,op:'cardio',uid,date:x.date,dateText:dText(parseDate(x.date)),type:x.type,dist:km>0?km:'',time:sec?hms(sec):'',
    pace:sec&&km>0?mmss(sec/km):'',speed:sec&&km>0?Math.round(36000*km/sec)/10:'',hrAvg:num(x.hrAvg)>0?num(x.hrAvg):'',hrMax:num(x.hrMax)>0?num(x.hrMax):'',
    kcal:num(x.kcal)>0?num(x.kcal):'',note:x.note||'',block:num(x.block)||'',prev:x.prev||null,del:!!x.del};

function queueMeasure(n,which,values){

  (S.out??={})[`measure:${n}:${which}`]={id:S.id,op:'measure',block:n,which,values};
  save();flush();

let flushing=false,reT=null;
async function flush(){
  if(!SYNC||flushing||!S.out) return;
  flushing=true;let wrote=false;
  for(const [k,p] of Object.entries(S.out)){
    if(p.id!==S.id){delete S.out[k];continue}
    try{
      const r=await fetch(SYNC,{method:'POST',body:JSON.stringify(p)});const j=await r.json();
      if(j.ok){delete S.out[k];wrote=true;if(p.op==='cardio'&&p.del&&S.cardio) delete S.cardio[p.uid];save()}
      else if(j.error&&/^(folder|sheet|workout|kind|bad)$/.test(String(j.error))){delete S.out[k];save()}
    }catch(e){break}
  }
  flushing=false;
  if(wrote){clearTimeout(reT);reT=setTimeout(()=>{if(S.id) load(S.id).catch(()=>{})},2500)}
}

  document.querySelectorAll('[data-crd]').forEach(b=>b.onclick=()=>{const k=b.dataset.crd;if(k.startsWith('s')) cardioEdit(null,cardioItems()[+k.slice(1)]);else cardioEdit(k)});
  const me=$('#meas');if(me) me.onclick=()=>measureEdit(pickBlock('pb').n);
  const rl=$('#relink');if(rl) rl.onclick=()=>{S.id='';S.plan=null;save();history.replaceState(null,'',location.pathname);render()};
}
function tapSet(i,k){
  const c=current(),e=c.w.ex[i],log=S.log[c.id]??={},sets=log.sets??={},row=sets[i]??=[];
  if(row[k]){edit(i,k);return}
  const pw=effWeight(c,e,i).w,pr=parseRange(e.rp)?.lo;
  const prev=row.slice(0,k).reverse().find(Boolean);
  row[k]=prev?{w:prev.w,r:prev.r,t:Date.now()}:{w:pw,r:Number.isFinite(pr)?pr:'',t:Date.now()};
  S.cur=c.id;
  const t=restSec(e.rest);S.rest={start:Date.now(),target:t,buzzed:false};
  save();render();queue(c);
}
function sheet(html){
  const box=document.createElement('div');box.className='scrim';
  box.innerHTML=`<div class="sheet">${html}</div>`;
  document.body.appendChild(box);
  box.onclick=ev=>{if(ev.target===box) box.remove()};
  return box;
}
function edit(i,k){
  const c=current(),e=c.w.ex[i],s=S.log[c.id].sets[i][k];
  const box=sheet(`<h3>${h(e.name)} · подход ${k+1}</h3>
    <div class="step"><span>Вес, кг</span><div class="c"><button data-d="w:-2.5">−</button><input id="ew" inputmode="decimal" value="${h(s.w===''?'':fmt(+s.w))}"><button data-d="w:2.5">+</button></div></div>
    <div class="step"><span>Повторы</span><div class="c"><button data-d="r:-1">−</button><input id="er" inputmode="numeric" value="${h(s.r)}"><button data-d="r:1">+</button></div></div>
    <div class="foot"><button class="btn sec" id="eclr">Не выполнен</button><button class="btn pri" id="eok">Готово</button></div>`);
  const close=()=>box.remove();
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    const [f,d]=b.dataset.d.split(':'),inp=box.querySelector(f==='w'?'#ew':'#er');
    const v=num(inp.value);inp.value=fmt(Math.max(0,(Number.isFinite(v)?v:0)+ +d));
  });
  box.querySelector('#eclr').onclick=()=>{S.log[c.id].sets[i][k]=null;save();close();render();queue(c)};
  box.querySelector('#eok').onclick=()=>{
    const w=num(box.querySelector('#ew').value),r=num(box.querySelector('#er').value);
    S.log[c.id].sets[i][k]={w:Number.isFinite(w)?w:'',r:Number.isFinite(r)?r:'',t:s.t};save();close();render();queue(c);
  };
}
function noteEdit(i){
  const c=current(),e=c.w.ex[i],L=S.log[c.id]??={};
  const box=sheet(`<h3>${h(e.name)}</h3>
    <textarea class="field" id="nt" rows="3" placeholder="Комментарий">${h(L.notes?.[i]||'')}</textarea>
    <div class="foot"><button class="btn sec" id="nx">Отмена</button><button class="btn pri" id="nok">Сохранить</button></div>`);
  const close=()=>box.remove();
  box.querySelector('#nx').onclick=close;
  box.querySelector('#nok').onclick=()=>{
    const v=box.querySelector('#nt').value.trim();
    (L.notes??={})[i]=v;if(!v) delete L.notes[i];
    S.cur=c.id;save();close();render();queue(c);
  };
  setTimeout(()=>box.querySelector('#nt').focus(),50);
}
function cardioEdit(uid,sheetRow){
  const x=uid?{...S.cardio[uid]}:sheetRow?{date:iso(parseDate(sheetRow.date))||today(),type:upc(sheetRow.type)||'Z2',dist:sheetRow.dist,time:sheetRow.time,hrAvg:sheetRow.hrAvg,hrMax:sheetRow.hrMax,kcal:sheetRow.kcal,note:sheetRow.note,block:num(sheetRow.block)||current()?.B.n||1,prev:{date:sheetRow.date,type:sheetRow.type,dist:sheetRow.dist}}
    :{date:today(),type:'Z2',dist:'',time:'',hrAvg:'',hrMax:'',kcal:'',note:'',block:current()?.B.n||1};
  const blocks=S.plan.blocks;
  const box=sheet(`<h3>${uid||sheetRow?'Кардио':'Новая кардио-тренировка'}</h3>
    <div class="seg sm">${CTYPES.map(([t])=>`<button data-ct="${t}" class="${x.type===t?'on':''}">${t}</button>`).join('')}</div>
    <div class="note" id="ct-note"></div>
    <div class="frow" style="margin-top:10px"><div><span class="lbl">Дата</span><input class="field sm" id="c-date" type="date" value="${h(x.date)}"></div><div><span class="lbl">Дистанция, км</span><input class="field sm" id="c-dist" inputmode="decimal" value="${h(x.dist)}" placeholder="5"></div></div>
    <div class="frow" style="margin-top:8px"><div><span class="lbl">Время (мм:сс)</span><input class="field sm" id="c-time" inputmode="numeric" value="${h(x.time)}" placeholder="30:00"></div><div><span class="lbl">Калории</span><input class="field sm" id="c-kcal" inputmode="numeric" value="${h(x.kcal)}"></div></div>
    <div class="frow" style="margin-top:8px"><div><span class="lbl">Пульс средний</span><input class="field sm" id="c-hr" inputmode="numeric" value="${h(x.hrAvg)}"></div><div><span class="lbl">Пульс макс</span><input class="field sm" id="c-hrm" inputmode="numeric" value="${h(x.hrMax)}"></div></div>
    <span class="lbl">Заметка</span><textarea class="field sm" id="c-note" rows="2">${h(x.note||'')}</textarea>
    ${blocks.length>1?`<span class="lbl">Блок</span><div class="seg sm">${blocks.map(b=>`<button data-cbk="${b.n}" class="${num(x.block)===b.n?'on':''}">Блок ${b.n}</button>`).join('')}</div>`:''}
    <div class="live" id="c-live"></div>
    <div class="foot">${uid||sheetRow?'<button class="btn sec" id="c-del">Удалить</button>':'<button class="btn sec" id="c-x">Отмена</button>'}<button class="btn pri" id="c-ok">Сохранить</button></div>`);
  const close=()=>box.remove(),g=id=>box.querySelector(id);
  const live=()=>{const sec=parseTime(g('#c-time').value),km=num(g('#c-dist').value);
    g('#c-live').textContent=sec&&km>0?`Темп ${mmss(sec/km)}/км · ${fmt(Math.round(36000*km/sec)/10)} км/ч`:'';
    const ct=CTYPES.find(([t])=>t===x.type);g('#ct-note').textContent=ct?`${ct[1]} · ${ct[2]}`:''};
  box.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{x.type=b.dataset.ct;box.querySelectorAll('[data-ct]').forEach(q=>q.classList.toggle('on',q===b));live()});
  box.querySelectorAll('[data-cbk]').forEach(b=>b.onclick=()=>{x.block=+b.dataset.cbk;box.querySelectorAll('[data-cbk]').forEach(q=>q.classList.toggle('on',q===b))});
  g('#c-time').oninput=live;g('#c-dist').oninput=live;live();
  const cx=g('#c-x');if(cx) cx.onclick=close;
  const cd=g('#c-del');if(cd) cd.onclick=()=>{const id=uid||('c'+Date.now().toString(36));S.cardio??={};S.cardio[id]={...x,uid:id,del:true};save();close();render();queueCardio(id)};
  g('#c-ok').onclick=()=>{
    const id=uid||('c'+Date.now().toString(36));
    Object.assign(x,{uid:id,date:g('#c-date').value||today(),dist:g('#c-dist').value.trim(),time:g('#c-time').value.trim(),kcal:g('#c-kcal').value.trim(),hrAvg:g('#c-hr').value.trim(),hrMax:g('#c-hrm').value.trim(),note:g('#c-note').value.trim()});
    if(!(num(x.dist)>0)&&!parseTime(x.time)){g('#c-live').textContent='Укажи дистанцию или время';return}
    (S.cardio??={})[id]=x;save();close();render();queueCardio(id);
  };
}
function measureEdit(n){
  const labels=['Вес тела, кг','Обхват груди, см','Обхват талии, см','Обхват бёдер, см','Обхват бедра, см','Обхват руки, см','% жира'];
  const sa=S.plan.summ[n]?.anthro||[],m=S.meas?.[n]||{};
  const val=(w,i)=>{const v=m[w]?.[i]??sa[i]?.[w]??'';return isNum(v)?fmt(num(v)):''};
  const box=sheet(`<h3>Замеры · блок ${n}</h3><table class="tbl"><tr><th>Параметр</th><th>Старт</th><th>Конец</th></tr>
    ${labels.map((l,i)=>`<tr><td>${h(l)}</td><td><input class="field sm" style="width:84px;text-align:right" inputmode="decimal" data-ms="start:${i}" value="${val('start',i)}"></td><td><input class="field sm" style="width:84px;text-align:right" inputmode="decimal" data-ms="end:${i}" value="${val('end',i)}"></td></tr>`).join('')}</table>
    <div class="foot"><button class="btn sec" id="m-x">Отмена</button><button class="btn pri" id="m-ok">Сохранить</button></div>`);
  const close=()=>box.remove();
  box.querySelector('#m-x').onclick=close;
  box.querySelector('#m-ok').onclick=()=>{
    const out={start:[],end:[]};
    box.querySelectorAll('[data-ms]').forEach(inp=>{const [w,i]=inp.dataset.ms.split(':');const v=num(inp.value);out[w][+i]=Number.isFinite(v)?v:''});
    const old=S.meas?.[n]||{};(S.meas??={})[n]=out;save();close();render();
    ['start','end'].forEach(w=>{const changed=out[w].some((v,i)=>v!==(old[w]?.[i]??(isNum(sa[i]?.[w])?num(sa[i][w]):'')));if(changed||!old[w]) queueMeasure(n,w,out[w])});
  };
}

// ── таймер отдыха ──────────────────────────────────
let tick=null;
function restTick(){
  clearInterval(tick);
  const box=$('#restbox');if(!box) return;
  const draw=()=>{
    document.body.classList.toggle('resting',!!S.rest);
    if(!S.rest){box.innerHTML='';clearInterval(tick);return}
    const el=Math.floor((Date.now()-S.rest.start)/1000),t=S.rest.target;
    if(el>3600){S.rest=null;save();box.innerHTML='';document.body.classList.remove('resting');return}
    const mm=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    const over=t&&el>=t;
    if(over&&!S.rest.buzzed){S.rest.buzzed=true;save();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
    box.innerHTML=`<div class="rest ${over?'over':''}"><span class="tm">${mm(el)}</span><span class="of">${t?'отдых '+mm(t):'отдых'}</span>
      ${t?'<button id="r30">+30 с</button>':''}<button id="rx">✕</button>${t?`<i class="line" style="width:${Math.min(100,el/t*100)}%"></i>`:''}</div>`;
    const a=$('#r30');if(a) a.onclick=()=>{S.rest.target+=30;S.rest.buzzed=false;save();draw()};
    $('#rx').onclick=()=>{S.rest=null;save();draw()};
  };
  draw();tick=setInterval(draw,1000);
}

// ── запуск ─────────────────────────────────────────
function bindGate(){
  const go=async()=>{
    const id=idFrom($('#link').value);
    if(!id){$('#gerr').textContent='Неверная ссылка';return}
    $('#open').disabled=true;
    try{await load(id,true)}catch(e){$('#gerr').textContent='Не удалось открыть программу';$('#open').disabled=false}
  };
  $('#open').onclick=go;$('#link').onkeydown=e=>{if(e.key==='Enter') go()};
}
async function load(id,strict){
  const fresh=await fetchPlan(id).catch(e=>{if(strict||!S.plan) throw e;return null});
  if(!fresh) return;
  if(id!==S.id){S.log={};S.cur='';S.rest=null;S.block=0;S.cardio={};S.meas={};S.out={}}
  S.id=id;S.plan=fresh;save();
  if(!$('.scrim')) render();
}
// ── отладка (только localhost) ─────────────────────
function dbg(){
  const c=current();
  return {tpl:S.plan.tpl,client:S.plan.client,hr:S.plan.hr,zones:hrZones(),cur:c?.id,tab:S.tab,
    blocks:S.plan.blocks.map(B=>({n:B.n,ready:B.ready,weeks:B.weeks.map(W=>({n:W.n,label:W.label,w:W.workouts.map(w=>({l:w.letter,k:w.kind,sub:w.sub,tot:w.tot,ex:w.ex}))}))})),
    cardio:S.plan.cardio,items:S.plan.cardio?cardioItems().map(x=>({date:x.date,type:x.type,km:x.km,sec:x.sec,paceS:x.paceS,spd:x.spd,local:!!x.local,block:x.block})):null,
    summ:S.plan.summ,over:S.plan.over,vol:S.plan.vol,food:S.plan.food,help:HELP.length,
    eff:c?c.w.ex.map((e,i)=>effWeight(c,e,i)):null,vol_est:c?volumeEstimate(c.B):null,week:c?weekStats(c.B):null,out:S.out,log:S.log,meas:S.meas,cardioLocal:S.cardio};
}
function seed(){
  const c=current();if(!c||S.seeded) return;S.seeded=true;
  const L=S.log[c.id]={sets:{},rpe_ex:{0:7,1:9,2:8},ready:{s:4,e:4,m:4},rpe:7,wnote:'тест'};
  c.w.ex.forEach((e,i)=>{if(i>3) return;const n=setsOf(e),w=effWeight(c,e,i).w||40,rg=parseRange(e.rp);
    L.sets[i]=Array.from({length:n},(_,k)=>({w,r:rg?(i===1?rg.lo-1:rg.hi):8,t:Date.now()-(n-k)*120000}))});
  L.done=dShort(new Date());L.fin=Date.now();
  (S.cardio??={}).cseed={uid:'cseed',date:today(),type:'Z2',dist:'5',time:'30:00',hrAvg:'145',hrMax:'160',kcal:'400',note:'лёгкий',block:c.B.n};
  (S.meas??={})[c.B.n]={start:[80,100,85,98,58,36,18],end:['','','','','','','']};
  queue(c);queueCardio('cseed');queueMeasure(c.B.n,'start',S.meas[c.B.n].start);save();
}
(function boot(){
  const P=new URLSearchParams(location.search);
  const q=idFrom(location.search+location.hash)||(DEV&&P.get('src')?'test':'');
  if(DEV&&P.get('tab')) S.tab=P.get('tab');
  if(DEV&&P.get('cur')) S.wantCur=P.get('cur');
  if(DEV&&P.get('seed')) S.wantSeed=true;
  if(q&&q!==S.id){S.id=q;S.plan=null;S.log={};S.cur='';S.rest=null;S.cardio={};S.meas={};S.out={}}
  if(q&&!DEV) history.replaceState(null,'',location.pathname+'?id='+q);
  if('serviceWorker' in navigator&&!DEV) navigator.serviceWorker.register('sw.js').catch(()=>{});
  render();
  if(S.id){
    load(S.id).then(()=>{if(DEV&&S.wantSeed){seed();if(S.wantCur) S.cur=S.wantCur;render()}}).catch(()=>{if(!S.plan){S.id='';$('#app').innerHTML=gate('Не удалось открыть программу');bindGate()}});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.id){load(S.id).catch(()=>{});flush()}});
    addEventListener('online',flush);flush();
  }
})();
</script>
